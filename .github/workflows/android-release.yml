name: Android CI - Build Release Bundle & APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build artifact type (bundle or apk)'
        required: true
        default: 'bundle'
        type: choice
        options:
          - bundle
          - apk
          - both

jobs:
  build-release:
    name: Build Release App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Release Bundle
        if: ${{ github.event.inputs.build_type == 'bundle' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release Bundle Artifact
        if: ${{ github.event.inputs.build_type == 'bundle' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ethio-worker-marketplace-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload Release APK Artifact
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: ethio-worker-marketplace-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
